<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX CAPACITY QR Sender</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: #111; padding: 20px; border-radius: 10px; border: 2px solid #ff0055; box-shadow: 0px 0px 20px rgba(255,0,85,0.5); }
        input[type="text"], input[type="file"] { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px;}
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #ff0055; font-weight: bold; border: none; border-radius: 5px; color: white; text-transform: uppercase; }
        #qr-container { display: flex; justify-content: center; margin-top: 20px; background: white; padding: 10px; border-radius: 10px; width: fit-content; margin-left: auto; margin-right: auto; }
        #status { margin-top: 15px; color: #00ff00; font-size: 1.4em; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚀 FULL CAPACITY QR STREAM</h2>
        
        <input type="file" id="fileInput" />
        <br><br>
        <button onclick="startStreaming()">Start Turbo Stream 🚀</button>

        <h3 id="status">Status: Standby</h3>
        <h4 id="chunk-info"></h4>
        
        <div id="qr-container"></div>
    </div>

    <script>
        let qrCode = new QRCode(document.getElementById("qr-container"), {
            width: 500,  // Bada QR size for dense data
            height: 500,
            correctLevel: QRCode.CorrectLevel.L 
        });

        let streamingInterval;
        
        // 🔥 FULL CAPACITY SETTINGS 🔥
        const CHUNK_SIZE = 800; // 4x zyada data per QR
        const SPEED_MS = 60;    // ~16 FPS (Super Fast)

        async function startStreaming() {
            clearInterval(streamingInterval);
            const fileInput = document.getElementById("fileInput");
            
            if (fileInput.files.length === 0) {
                alert("Please select a file!");
                return;
            }

            const file = fileInput.files[0];
            const filename = file.name;
            const fileData = await readFileAsBase64(file);

            const chunks = [];
            for (let i = 0; i < fileData.length; i += CHUNK_SIZE) {
                chunks.push(fileData.substring(i, i + CHUNK_SIZE));
            }

            const totalChunks = chunks.length;
            document.getElementById("status").innerText = `Total Chunks: ${totalChunks} (Max Density)`;
            
            let currentIndex = 0;

            streamingInterval = setInterval(() => {
                const payload = `${filename}|${totalChunks}|${currentIndex}|${chunks[currentIndex]}`;
                
                qrCode.clear();
                qrCode.makeCode(payload);
                
                document.getElementById("chunk-info").innerText = `Flashing: ${currentIndex + 1} / ${totalChunks}`;
                
                currentIndex++;
                if (currentIndex >= totalChunks) {
                    currentIndex = 0; 
                }
            }, SPEED_MS); 
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
