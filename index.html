<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX CAPACITY QR Receiver</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #111; padding: 20px; border-radius: 10px; border: 2px solid #00ff00; }
        #reader { width: 100%; margin: 20px auto; border: 4px solid #ff0055; border-radius: 10px; background: black; }
        #progress-container { width: 100%; background-color: #444; border-radius: 5px; margin-top: 20px; display: none; }
        #progress-bar { width: 0%; height: 35px; background-color: #ff0055; border-radius: 5px; transition: width 0.05s; }
        #status { font-size: 1.3em; font-weight: bold; margin-top: 15px; color: #00ff00; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📸 TURBO SCANNER</h2>
        <p>HD Camera Activated for Dense QR Stream.</p>
        
        <div id="reader"></div>
        
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        
        <p id="status">Scanner is Ready...</p>
    </div>

    <script>
        let receivedChunks = {};
        let totalExpectedChunks = 0;
        let filename = "download.txt";
        let isDownloading = false;

        // 🔥 FULL CAPACITY CAMERA SETTINGS 🔥
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 60, // Max Camera Scan Rate
            qrbox: { width: 350, height: 350 }, // Bada scanning area
            videoConstraints: {
                facingMode: "environment",
                width: { ideal: 1920 }, // Forcing HD resolution
                height: { ideal: 1080 }
            }
        }, false);

        html5QrcodeScanner.render(onScanSuccess, onScanFailure);

        function onScanSuccess(decodedText) {
            if (isDownloading) return; 

            const parts = decodedText.split('|');
            if (parts.length >= 4) {
                const scannedFilename = parts[0];
                const total = parseInt(parts[1]);
                const index = parseInt(parts[2]);
                const data = parts.slice(3).join('|'); 

                if (totalExpectedChunks === 0) {
                    totalExpectedChunks = total;
                    filename = scannedFilename;
                    document.getElementById("progress-container").style.display = "block";
                }

                if (!receivedChunks[index]) {
                    receivedChunks[index] = data;
                    
                    const receivedCount = Object.keys(receivedChunks).length;
                    const progress = (receivedCount / totalExpectedChunks) * 100;
                    document.getElementById("progress-bar").style.width = progress + "%";
                    document.getElementById("status").innerText = `⚡ SPEED: ${receivedCount} / ${totalExpectedChunks} Chunks`;

                    if (receivedCount === totalExpectedChunks) {
                        isDownloading = true;
                        document.getElementById("status").innerText = "✅ 100% DONE! Assembling File...";
                        html5QrcodeScanner.clear(); 
                        assembleAndDownload();
                    }
                }
            }
        }

        function onScanFailure(error) {
            // Background errors ignore karo
        }

        function assembleAndDownload() {
            let finalBase64DataURL = "";
            for (let i = 0; i < totalExpectedChunks; i++) {
                finalBase64DataURL += receivedChunks[i];
            }

            const link = document.createElement('a');
            link.href = finalBase64DataURL;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            document.getElementById("status").innerText = `🎉 File Downloaded: ${filename}`;
        }
    </script>
</body>
</html>
