<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Data Sender</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #111; color: white; text-align: center; }
        #controlPanel { position: absolute; top: 20px; width: 100%; z-index: 10; }
        input { padding: 10px; font-size: 16px; width: 60%; max-width: 300px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; background: #00d2ff; font-weight: bold; border: none; border-radius: 5px; }
        #colorScreen { width: 100vw; height: 100vh; background-color: black; position: absolute; top: 0; left: 0; z-index: 1; }
        #status { margin-top: 15px; font-size: 1.2em; font-weight: bold; text-shadow: 1px 1px 2px black;}
    </style>
</head>
<body>
    <div id="colorScreen"></div>
    
    <div id="controlPanel">
        <h2>🎨 Color Data Sender</h2>
        <input type="text" id="message" value="HI" />
        <br>
        <button onclick="startTransmission()" id="sendBtn">Send via Screen</button>
        <p id="status">Status: Standby</p>
    </div>

    <script>
        function textToBinary(text) {
            return text.split('').map(char => char.charCodeAt(0).toString(2).padStart(8, '0')).join('');
        }

        async function startTransmission() {
            const btn = document.getElementById("sendBtn");
            const statusLabel = document.getElementById("status");
            const colorScreen = document.getElementById("colorScreen");
            btn.disabled = true;

            const message = document.getElementById("message").value;
            const binaryData = textToBinary(message);
            
            // Speed: 2 symbols per second = 4 bits per second (Safe speed for testing)
            const delayMs = 500; 

            // Color Map: 00=Red, 01=Green, 10=Blue, 11=Yellow
            const colors = {
                '00': 'rgb(255, 0, 0)',
                '01': 'rgb(0, 255, 0)',
                '10': 'rgb(0, 0, 255)',
                '11': 'rgb(255, 255, 0)'
            };

            statusLabel.innerText = "Syncing... (Magenta)";
            
            // SYNC SIGNAL: Show Magenta for 3 seconds to lock receiver
            colorScreen.style.backgroundColor = 'rgb(255, 0, 255)'; 
            await new Promise(resolve => setTimeout(resolve, 3000));

            statusLabel.innerText = `TRANSMITTING DATA...`;

            // Data Transmission Loop (Reading 2 bits at a time)
            for (let i = 0; i < binaryData.length; i += 2) {
                const chunk = binaryData.substring(i, i + 2);
                colorScreen.style.backgroundColor = colors[chunk];
                await new Promise(resolve => setTimeout(resolve, delayMs));
            }

            // End Transmission
            colorScreen.style.backgroundColor = 'black';
            statusLabel.innerText = "✅ Transmission Complete!";
            btn.disabled = false;
        }
    </script>
</body>
</html>
