<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO QR Streaming Receiver</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #222; padding: 20px; border-radius: 10px; }
        #reader { width: 100%; margin: 20px auto; border: 4px solid #00d2ff; border-radius: 10px; background: black; }
        #progress-container { width: 100%; background-color: #444; border-radius: 5px; margin-top: 20px; display: none; }
        #progress-bar { width: 0%; height: 30px; background-color: #00ff00; border-radius: 5px; transition: width 0.1s; }
        #status { font-size: 1.2em; font-weight: bold; margin-top: 15px; color: #00d2ff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📷 PRO QR Receiver</h2>
        <p>Laptop screen par chal rahe QR Stream ko scan karein.</p>
        
        <div id="reader"></div>
        
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        
        <p id="status">Scanner is Ready...</p>
    </div>

    <script>
        let receivedChunks = {};
        let totalExpectedChunks = 0;
        let filename = "download.txt";
        let isDownloading = false;

        // QR Scanner Setup
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 30, qrbox: {width: 250, height: 250} }, /* verbose= */ false);

        html5QrcodeScanner.render(onScanSuccess, onScanFailure);

        function onScanSuccess(decodedText) {
            if (isDownloading) return; // Download shuru ho gaya toh ignore karo

            // Header Parse Karna -> filename|total|index|data
            const parts = decodedText.split('|');
            if (parts.length >= 4) {
                const scannedFilename = parts[0];
                const total = parseInt(parts[1]);
                const index = parseInt(parts[2]);
                
                // Data part mein pipeline character ho sakta hai (Base64 padding), isliye baki hissa jodna hoga
                const data = parts.slice(3).join('|'); 

                if (totalExpectedChunks === 0) {
                    totalExpectedChunks = total;
                    filename = scannedFilename;
                    document.getElementById("progress-container").style.display = "block";
                }

                // Agar chunk pehle se nahi mila hai, toh save karo
                if (!receivedChunks[index]) {
                    receivedChunks[index] = data;
                    
                    // Progress Update
                    const receivedCount = Object.keys(receivedChunks).length;
                    const progress = (receivedCount / totalExpectedChunks) * 100;
                    document.getElementById("progress-bar").style.width = progress + "%";
                    document.getElementById("status").innerText = `Received: ${receivedCount} / ${totalExpectedChunks} Chunks`;

                    // Auto-Assembly aur Download check
                    if (receivedCount === totalExpectedChunks) {
                        isDownloading = true;
                        document.getElementById("status").innerText = "✅ 100% Received! Assembling File...";
                        html5QrcodeScanner.clear(); // Camera band karo
                        assembleAndDownload();
                    }
                }
            }
        }

        function onScanFailure(error) {
            // Background scanning errors ko ignore karna hai
        }

        // File ko wapas jodna aur download karna
        function assembleAndDownload() {
            let finalBase64DataURL = "";
            for (let i = 0; i < totalExpectedChunks; i++) {
                finalBase64DataURL += receivedChunks[i];
            }

            // Auto-Download Trigger
            const link = document.createElement('a');
            link.href = finalBase64DataURL;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            document.getElementById("status").innerText = `🎉 File Downloaded: ${filename}`;
        }
    </script>
</body>
</html>
